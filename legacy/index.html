<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키프 Keep — 약속을 기록하고 지키게 돕는다</title>
<meta name="description" content="친구·지인과의 약속을 증서로 남기고, 기한이 지나면 단계적으로 재촉해 주는 서비스">
<meta property="og:title" content="키프 Keep — 약속증서가 도착했어요">
<meta property="og:description" content="말로 한 약속을, 지킬 수밖에 없는 기록으로. 링크를 열어 내용을 확인하고 서명해 주세요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%23cf3d28' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='serif' font-weight='800'%3E約%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="qrcode.js"></script>
<style>
:root{
  --paper:#f5f1ea;--card:#fffdf9;--ink:#1f1b2d;--ink2:#575265;--ink3:#8b8597;--line:#e7dfd2;--line2:#d9cfbf;
  --seal:#cf3d28;--seal-d:#a52f1d;--seal-soft:#fbe8e3;--ok:#2b8a57;--ok-soft:#e2f2e8;--warn:#b9761a;--warn-soft:#fbf0dc;
  --blue:#3453c4;--blue-soft:#e7ecfb;--r:16px;--shadow:0 1px 0 rgba(31,27,45,.04),0 6px 20px -12px rgba(31,27,45,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 104px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0;line-height:1.3}
.sealmark{width:34px;height:34px;border-radius:9px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:18px;transform:rotate(-6deg);box-shadow:0 2px 0 var(--seal-d);flex:none}
.mode{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.mode i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
h1{font-size:23px;line-height:1.3;letter-spacing:-.02em;margin:14px 0 6px}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--ink2)}.faint{color:var(--ink3);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.seal{border-color:#efc4ba;background:linear-gradient(180deg,#fff7f4,#fffdf9)}
.card.ok{border-color:#bfe0cc;background:linear-gradient(180deg,#f2fbf5,#fffdf9)}
.card.warn{border-color:#efd9ac;background:linear-gradient(180deg,#fff9ee,#fffdf9)}
.card.blue{border-color:#c5d1f3;background:linear-gradient(180deg,#f3f6fe,#fffdf9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s;text-decoration:none;color:var(--ink);min-height:44px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.kakao{background:#fee500;border-color:#fee500;color:#191600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.small{padding:6px 11px;min-height:34px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
label.f em{font-style:normal;color:var(--seal);margin-left:3px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:11px 12px;outline:none;transition:border .15s,box-shadow .15s}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,27,45,.08)}
textarea.i{min-height:120px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#ece6dc;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.tpl b{display:block;font-size:14.5px}.tpl span{font-size:12.5px;color:var(--ink3)}
.tpl.on{border-color:var(--seal);background:var(--seal-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#efe9df;color:var(--ink2);white-space:nowrap}
.pill.seal{background:var(--seal-soft);color:var(--seal-d)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.blue{background:var(--blue-soft);color:var(--blue)}
.list .item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow)}
.item .t{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.item .s{font-size:13px;color:var(--ink2);margin-top:2px}
.dday{font-weight:800;font-size:15px;letter-spacing:-.02em}
.dday.late{color:var(--seal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--ink3)}
.hero{padding:22px 4px 6px}
.hero .tag{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.03em}
.hero .tag span{color:var(--seal)}
.empty{text-align:center;padding:30px 10px;color:var(--ink2)}
.qs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q{background:var(--warn-soft);color:#7b5212;border-radius:10px;padding:8px 11px;font-size:13.5px}
.quote{border-left:3px solid var(--line2);padding:4px 0 4px 10px;color:var(--ink2);font-size:13.5px;white-space:pre-wrap}
.steps{display:flex;gap:6px;margin:4px 0 2px}
.steps div{flex:1;height:4px;border-radius:4px;background:#e4ddd1}
.steps div.on{background:var(--ink)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 4px}
.track .st{text-align:center;font-size:11.5px;color:var(--ink3)}
.track .dot{height:6px;border-radius:6px;background:#e4ddd1;margin-bottom:6px}
.track .st.done .dot{background:var(--ink2)}.track .st.now .dot{background:var(--seal)}
.track .st.now{color:var(--seal-d);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;width:100%;margin-top:8px}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,27,45,.06)}
.opt small{display:block;font-weight:700;font-size:12px;color:var(--ink3);margin-bottom:2px}
.inbox .msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;white-space:pre-wrap}
.inbox .msg small{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:3px;font-weight:600}
.tl{position:relative;margin:6px 0 0 6px;padding-left:18px;border-left:2px solid var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev:before{content:'';position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink3)}
.tl .ev.seal:before{border-color:var(--seal);background:var(--seal)}
.tl .ev.ok:before{border-color:var(--ok);background:var(--ok)}
.tl .ev b{font-size:14px}.tl .ev div{font-size:13.5px;color:var(--ink2);white-space:pre-wrap}
.tl .ev time{display:block;font-size:11.5px;color:var(--ink3)}
.pad-wrap{border:1.5px dashed var(--line2);border-radius:12px;background:#fff;position:relative;touch-action:none}
.pad-wrap canvas{display:block;width:100%;height:150px;border-radius:12px;cursor:crosshair;touch-action:none}
.pad-wrap .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px;pointer-events:none}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin-top:10px;color:var(--ink2)}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--seal)}
.qrbig{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px auto;max-width:300px}
.qrbig svg{width:100%;height:auto;display:block}
.linkbox{font-size:12px;background:#f2ede5;border-radius:9px;padding:8px 10px;word-break:break-all;color:var(--ink2);max-height:64px;overflow:hidden;position:relative}
.linkbox:after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(transparent,#f2ede5)}
.howto{counter-reset:h;margin:0;padding:0;list-style:none}
.howto li{position:relative;padding:0 0 10px 34px;font-size:14px;color:var(--ink2)}
.howto li:before{counter-increment:h;content:counter(h);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.howto b{color:var(--ink)}
.disc{font-size:12px;color:var(--ink3);text-align:center;margin:26px 8px 0;line-height:1.6}
details.cert-d>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cert-d>summary::-webkit-details-marker{display:none}
details.cert-d>summary:after{content:'펼치기';font-size:12.5px;font-weight:600;color:var(--ink3)}
details.cert-d[open]>summary:after{content:'접기'}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr 1fr;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav.bottom button{border:0;background:none;font-size:12px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
nav.bottom button.on{color:var(--ink)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom .plus{background:var(--seal);color:#fff;border-radius:14px;margin:0 10px;box-shadow:0 2px 0 var(--seal-d)}
nav.bottom .plus.on{color:#fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,480px);opacity:0;transition:.25s;z-index:50;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.verify-ok{color:var(--ok);font-weight:700}.verify-bad{color:var(--seal);font-weight:700}
.cert{background:#fffef9;border:1px solid #d9ccb4;border-radius:6px;padding:26px 22px 22px;position:relative;font-family:'Nanum Myeongjo',serif;color:#211d18;box-shadow:inset 0 0 0 5px #fffef9,inset 0 0 0 6px #e3d6bd}
.cert .ct{text-align:center;font-size:24px;font-weight:800;letter-spacing:.35em;margin:4px 0 4px;padding-left:.35em}
.cert .cno{text-align:center;font-family:'IBM Plex Sans KR',sans-serif;font-size:11px;color:#8c8170;margin-bottom:16px}
.cert .lead{font-size:15px;line-height:1.85;margin:0 0 14px}
.cert table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
.cert th{width:28%;text-align:left;font-weight:700;padding:8px 6px;border-top:1px solid #e3d6bd;vertical-align:top;color:#5b5143}
.cert td{padding:8px 6px;border-top:1px solid #e3d6bd;vertical-align:top}
.cert tr:last-child th,.cert tr:last-child td{border-bottom:1px solid #e3d6bd}
.cert .sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cert .sig{border:1px solid #e3d6bd;border-radius:6px;padding:10px;min-height:120px;position:relative;background:#fff}
.cert .sig .role{font-family:'IBM Plex Sans KR',sans-serif;font-size:11px;color:#8c8170}
.cert .sig .nm{font-weight:800;font-size:16px}
.cert .sig img{width:100%;height:58px;object-fit:contain;display:block;margin:2px 0}
.cert .sig .meta{font-family:'IBM Plex Sans KR',sans-serif;font-size:10.5px;color:#8c8170;line-height:1.45}
.cert .sig .wait{height:58px;display:grid;place-items:center;font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;color:#b3a892;border:1px dashed #e3d6bd;border-radius:4px;margin:4px 0}
.cert .stamp{position:absolute;right:16px;top:16px;width:70px;height:70px;border:3px solid #cf3d28;border-radius:50%;color:#cf3d28;display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px;line-height:1.15;transform:rotate(-12deg);opacity:.85}
.cert .vf{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed #e3d6bd;font-family:'IBM Plex Sans KR',sans-serif;font-size:11px;color:#7a705f}
.cert .vf .qr{width:74px;height:74px;flex:none}
.cert .vf .qr svg{width:100%;height:100%}
.cert .vf code{font-size:10.5px;word-break:break-all;color:#4a4236}
.cert .amend{font-size:13px;margin:0 0 12px;padding:8px 10px;background:#fbf6ea;border-radius:4px}
.cert .note{font-family:'IBM Plex Sans KR',sans-serif;font-size:10.5px;color:#9a8f7c;margin-top:10px;line-height:1.5}
@media (max-width:400px){.cert{padding:22px 14px 16px}.cert .ct{font-size:21px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="logo" data-act="home"><span class="sealmark">約</span><span>키프 Keep<small>말로 한 약속을, 지킬 수밖에 없는 기록으로</small></span></button>
    <span class="mode" title="약속은 서버가 아니라 이 휴대폰(브라우저)에 저장돼요."><i></i>이 기기에 저장</span>
  </header>
  <main id="view"></main>
  <p class="disc">키프는 약속의 증거를 남기고 이행을 돕는 도구입니다. 법률 자문이 아니며, 증서는 공증·강제집행력이 있는 문서가 아닙니다.</p>
</div>
<nav class="bottom"><div class="in">
  <button data-act="home" id="nav-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>내 약속</button>
  <button data-act="new" class="plus" id="nav-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>새 약속</button>
  <button data-act="verify" id="nav-verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>위변조 확인</button>
</div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="file-cert" accept=".html,text/html" hidden>
<input type="file" id="file-backup" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ 기본 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const SITE = location.origin + location.pathname;

const TPL = {
  loan:  {name:'금전 차용증',      kind:'money', desc:'돈을 빌려주고 받을 때',   a:'빌려준 사람', b:'빌린 사람',     what:'빌린 금액', due:'갚을 날',     how:'갚는 방법'},
  lend:  {name:'물건 대여 확인서', kind:'item',  desc:'물건을 빌려줄 때',       a:'빌려준 사람', b:'빌린 사람',     what:'빌린 물건', due:'돌려줄 날',   how:'돌려주는 방법'},
  pledge:{name:'약속 이행 각서',   kind:'task',  desc:'해야 할 일을 약속할 때', a:'약속받는 사람', b:'약속한 사람', what:'약속 내용', due:'지킬 날',     how:'지키는 방법'},
  team:  {name:'역할 분담 합의서', kind:'task',  desc:'조별과제·공동 작업',     a:'요청한 사람', b:'맡은 사람',     what:'맡은 역할', due:'완료 기한',   how:'결과 공유 방법'},
  split: {name:'경비 정산 확인서', kind:'money', desc:'여행·모임 비용 나누기',  a:'먼저 낸 사람', b:'정산할 사람',  what:'정산 금액', due:'정산할 날',   how:'정산 방법'}
};
const STAGES = [
  {n:1, name:'사전 알림', label:'D-3'}, {n:2, name:'당일 알림', label:'D-day'}, {n:3, name:'1차 재촉', label:'D+3'},
  {n:4, name:'2차 재촉', label:'D+7'}, {n:5, name:'공식 통지', label:'D+14'}
];
const STATUS = {
  pending_b:{t:'서명 대기', c:'blue'}, revise:{t:'수정 요청됨', c:'warn'}, active:{t:'진행 중', c:''},
  reported:{t:'이행 확인 대기', c:'blue'}, done:{t:'지킴 완료', c:'ok'}
};

async function sha256(text) {

}

function qrSVG(text, ecc = 'L') {

function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const [x1, y1] = pts[0], [x2, y2] = pts[pts.length - 1];
  let idx = 0, max = 0; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < pts.length - 1; i++) { const d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + x2 * y1 - y2 * x1) / len; if (d > max) { max = d; idx = i; } }
  if (max > eps) return rdp(pts.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(pts.slice(idx), eps));
  return [pts[0], pts[pts.length - 1]];
}
function padVector(key) {
  const st = S.pads[key]; if (!st) return null;
  const strokes = st.strokes.filter(s => s.length).map(s => rdp(s.map(([x, y]) => [x * 200 / 560, y * 60 / 170]), 1.0).flatMap(([x, y]) => [Math.round(x), Math.round(y)]));
  const pts = strokes.reduce((n, s) => n + s.length / 2, 0);
  return pts >= 4 ? strokes : null;
}

  const url = c.toDataURL('image/png'); sigImgCache.set(k, url); return url;
}

/* ============ 규칙 기반 정리 ============ */
function parseAmount(t) {
  let m = t.match(/(\d+)\s*만\s*(?:(\d+)\s*천)?\s*원?/); if (m) return (+m[1]) * 10000 + (m[2] ? +m[2] * 1000 : 0);
  m = t.match(/(\d+)\s*천\s*원/); if (m) return +m[1] * 1000;
  m = t.match(/(\d[\d,]{2,})\s*원/); if (m) return +m[1].replace(/,/g, '');
  return null;
}
function parseDate(t) {

  if ((m = t.match(/(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/))) { let y = base.getFullYear(); if (new Date(y, +m[1] - 1, +m[2]) < base) y++; return mk(y, +m[1] - 1, +m[2]); }
  if ((m = t.match(/다음\s*달\s*(\d{1,2})\s*일/))) return mk(base.getFullYear(), base.getMonth() + 1, +m[1]);
  if ((m = t.match(/이번\s*달\s*(\d{1,2})\s*일/))) return mk(base.getFullYear(), base.getMonth(), +m[1]);
  if (/다음\s*달\s*말/.test(t)) return mk(base.getFullYear(), base.getMonth() + 2, 0);
  if (/이번\s*달\s*말/.test(t)) return mk(base.getFullYear(), base.getMonth() + 1, 0);
  if ((m = t.match(/(이번|다음|담)\s*주\s*([월화수목금토일])요일/))) {
    const days = '월화수목금토일', mon = new Date(base); mon.setDate(base.getDate() - ((base.getDay() + 6) % 7));
    mon.setDate(mon.getDate() + (m[1] === '이번' ? 0 : 7) + days.indexOf(m[2])); return ymd(mon);
  }

  if (/글피/.test(t)) return plus(3); if (/모레/.test(t)) return plus(2); if (/내일/.test(t)) return plus(1);
  if ((m = t.match(/(\d{1,2})\s*일\s*(까지|에|날)/))) { let mo = base.getMonth(); if (+m[1] < base.getDate()) mo++; return mk(base.getFullYear(), mo, +m[1]); }
  return '';
}

  const kind = TPL[d.tpl].kind;

  if (kind === 'task') { const l = key.find(x => /할게|하기로|맡을게|해올게|만들게|보낼게/.test(x)); if (l) out.task = body(l).replace(/[ㅋㅎㅠㅜ!~]+/g, '').trim(); }

      toast({sign: '상대가 서명했어요. 증서가 확정됐어요!', revise: '상대가 수정을 요청했어요.', nudge: '재촉 메시지가 도착했어요.', notice: '이행 촉구서가 도착했어요.', request: '상대가 요청을 보냈어요.', answer: '요청에 대한 답이 왔어요.', report: '상대가 이행 완료를 신고했어요.', confirm: '약속 지킴 완료!', reject: '이행 확인이 아직이래요.'}[msg.a.t] || '반영했어요.', 3800);
    }

}

/* ============ 화면 ============ */
function setNav(which) { ['home', 'new', 'verify'].forEach(k => $('#nav-' + k).classList.toggle('on', k === which)); }
function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !['file', 'checkbox', 'radio', 'range'].includes(a.type) && !S.forceRender) { S.pendingRender = true; return; }
  S.forceRender = false; S.pendingRender = false;
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('s=') || h.startsWith('u=')) { $('#view').innerHTML = '<div class="empty">링크를 여는 중…</div>'; handleIncoming(h); return; }
  let html;
  if (h === 'new') { setNav('new'); html = viewNew(); }
  else if (h === 'verify') { setNav('verify'); html = viewVerify(); }
  else if (h === 'orphan') { setNav(''); html = viewOrphan(); }
  else if (h.startsWith('p-')) { setNav(''); html = viewDetail(h.slice(2)); }
  else { setNav('home'); html = viewHome(); }
  $('#view').innerHTML = html;
  afterRender();
}
function forceRender() { S.forceRender = true; render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (S.pendingRender) render(); }, 0));
function go(h) { if (location.hash.slice(1) === h) forceRender(); else location.hash = h; }
window.addEventListener('hashchange', () => { S.forceRender = true; render(); window.scrollTo(0, 0); });

function draftToPromise(d) {

    ${p.warn ? `<div class="card warn flat">${esc(p.warn)}</div>` : ''}`;

  else body = activeView(p, u, role);
  const tl = (p.events || []).slice().reverse().map(e => `<div class="ev ${e.type === 'done' || e.type === 'confirm' ? 'ok' : e.type === 'sign' ? 'seal' : ''}"><b>${esc(e.text)}</b><time>${stamp(e.at)}${e.sim ? ' · 시연 시각 ' + esc(e.sim) : ''} · ${e.by === 'A' ? esc(p.aName) : e.by === 'B' ? esc(p.bName) : '키프'}</time>${e.detail ? `<div>${esc(e.detail)}</div>` : ''}</div>`).join('');

      ${isFinal ? `<div class="row" style="margin-top:10px"><button class="btn small" data-act="dlcert" data-id="${p.id}">증서 파일 저장</button><button class="btn small" data-act="dlpack" data-id="${p.id}">증거 묶음 저장</button></div>` : ''}</details>

function pendingA(p, u) {

    let n = 0; data.promises.forEach(p => { const cur = S.promises.get(p.id); if (!cur || (p.updatedAt || 0) > (cur.updatedAt || 0)) { S.promises.set(p.id, p); n++; } });
    lsSave(); toast(`약속 ${n}개를 불러왔어요.`); forceRender();
  } catch (err) { toast('키프 백업 파일이 아니에요.'); }
});
function exportHTML(p, withTimeline) {
  const css = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join('\n'); } catch (e) { return ''; } }).join('\n');
  const tl = withTimeline ? `<h2 style="font-family:sans-serif;margin:28px 0 10px">증거 타임라인</h2><div class="tl">${(p.events || []).map(e => `<div class="ev"><b>${esc(e.text)}</b><time>${stamp(e.at)}${e.sim ? ' · 시연 시각 ' + esc(e.sim) : ''}</time>${e.detail ? `<div>${esc(e.detail)}</div>` : ''}</div>`).join('')}</div>` : '';
  const payload = JSON.stringify({app: 'keep', v: 2, hash: p.hash, exportedAt: Date.now(), promise: Object.assign(JSON.parse(canonical(p)), {createdAt: p.createdAt, sigA: p.sigA, sigB: p.sigB})}).replace(/</g, '\\u003c');
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet"><title>${esc(TPL[p.tpl].name)} · ${esc(p.title)}</title><style>${css}\nbody{padding:24px}.wrap{max-width:640px;margin:0 auto}</style></head><body><div class="wrap">${certHTML(p)}${tl}</div><script type="application/json" id="keep-data">${payload}<\/script></body></html>`;
}
const safeName = s => String(s || '약속').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
function saveFile(name, data, type) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], {type: type + ';charset=utf-8'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('저장했어요. 다운로드 폴더를 확인하세요.');
  } catch (e) { toast('저장하지 못했어요.'); }
}
async function copyText(text, say) {
  try { await navigator.clipboard.writeText(text); if (say) toast('복사했어요. 카톡에 붙여넣어 보내세요.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
    if (say) toast(ok ? '복사했어요. 카톡에 붙여넣어 보내세요.' : '복사가 막혀 있어요.');
  }
}
async function shareText(text) {

  copyText(text, true);
}
